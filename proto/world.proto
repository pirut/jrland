syntax = "proto3";

package jrland.world.v1;

option go_package = "github.com/jrbussard/jrland/proto;worldpb";

enum BlockType {
  BLOCK_TYPE_AIR = 0;
  BLOCK_TYPE_GRASS = 1;
  BLOCK_TYPE_DIRT = 2;
  BLOCK_TYPE_STONE = 3;
  BLOCK_TYPE_WOOD = 4;
  BLOCK_TYPE_LEAF = 5;
  BLOCK_TYPE_GLASS = 6;
}

enum ChatScope {
  CHAT_SCOPE_LOCAL = 0;
  CHAT_SCOPE_GLOBAL = 1;
}

enum EntityKind {
  ENTITY_KIND_UNKNOWN = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_TREE = 2;
  ENTITY_KIND_CREATURE = 3;
  ENTITY_KIND_STRUCTURE = 4;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message InventorySlot {
  string item_id = 1;
  uint32 count = 2;
  uint32 hotbar_index = 3;
  uint32 block_type = 4;
}

message ChunkCoord {
  int32 x = 1;
  int32 z = 2;
}

message EntitySnapshot {
  string entity_id = 1;
  EntityKind kind = 2;
  string name = 3;
  Vector3 position = 4;
  Vector3 velocity = 5;
  float yaw = 6;
  float health = 7;
}

message EntityDelta {
  string entity_id = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  float yaw = 4;
  float health = 5;
  bool removed = 6;
}

message ChunkSnapshot {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  uint32 version = 3;
  uint32 size_x = 4;
  uint32 size_y = 5;
  uint32 size_z = 6;
  repeated uint32 blocks = 7 [packed = true];
}

message ChunkChange {
  uint32 index = 1;
  uint32 block_type = 2;
}

message ChunkDelta {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  uint32 version = 3;
  repeated ChunkChange changes = 4;
}

message ChatMessage {
  ChatScope scope = 1;
  string author_id = 2;
  string author_name = 3;
  string text = 4;
  uint64 time_ms = 5;
}

message WelcomeSnapshot {
  string session_id = 1;
  string world_id = 2;
  string region_id = 3;
  string self_player_id = 4;
  repeated EntitySnapshot entities = 5;
  repeated ChunkSnapshot chunks = 6;
  repeated InventorySlot inventory = 7;
}

message WorldState {
  repeated EntitySnapshot entities = 1;
  repeated ChunkSnapshot chunks = 2;
  repeated InventorySlot inventory = 3;
}

message InventoryDelta {
  repeated InventorySlot slots = 1;
}

message HandoffPrepare {
  string next_region_id = 1;
  string next_address = 2;
  string ticket = 3;
}

message HandoffCommit {
  string next_region_id = 1;
}

message ServerError {
  string code = 1;
  string message = 2;
}

message Ack {
  uint32 seq = 1;
}

message ClientHello {
  string ticket = 1;
  string client_name = 2;
}

message MoveIntent {
  float move_x = 1;
  float move_z = 2;
  bool sprint = 3;
  float yaw = 4;
}

message InputFrame {
  MoveIntent move = 1;
}

message MineCommand {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message BuildCommand {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  uint32 block_type = 4;
}

message CraftCommand {
  string recipe_id = 1;
}

message UseCommand {
  string item_id = 1;
}

message ChatLocalMessage {
  string text = 1;
}

message ClientEnvelope {
  string session_id = 1;
  uint32 seq = 2;
  uint64 client_time_ms = 3;
  oneof payload {
    ClientHello hello = 10;
    InputFrame input_frame = 11;
    MineCommand mine_command = 12;
    BuildCommand build_command = 13;
    CraftCommand craft_command = 14;
    UseCommand use_command = 15;
    ChatLocalMessage chat_local = 16;
    Ack ack = 17;
  }
}

message ServerEnvelope {
  uint64 tick = 1;
  uint64 server_time_ms = 2;
  uint32 baseline_seq = 3;
  oneof payload {
    WelcomeSnapshot welcome = 10;
    WorldState world_state = 11;
    ChunkSnapshot chunk_snapshot = 12;
    ChunkDelta chunk_delta = 13;
    InventoryDelta inventory_delta = 14;
    ChatMessage chat = 15;
    HandoffPrepare handoff_prepare = 16;
    HandoffCommit handoff_commit = 17;
    ServerError error = 18;
    Ack ack = 19;
    EntityDelta entity_delta = 20;
  }
}
